name: Deploy NoviVerse to GitHub Pages

# The owner starts deployment explicitly from the Actions tab.
# Uploading or changing source does not automatically publish the site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify science and rig checks
        run: npm test
      - name: Verify bundled assets
        run: npm run assets:verify
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Build static game
        run: npm run build
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
