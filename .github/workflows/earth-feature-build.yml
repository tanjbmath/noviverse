name: Verify and package Earth feature
on:
  push:
    branches:
      - feature/earth-continent-explorer
permissions:
  contents: write
jobs:
  verify-and-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run assets:verify
      - run: npm run build
      - name: Commit verified static build on this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package verified Earth continent explorer"
          git push origin HEAD:feature/earth-continent-explorer
